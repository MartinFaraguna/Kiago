<app-header></app-header>

<div class="h-[calc(100vh-200px)] flex items-center justify-center px-4">

  <form
  [formGroup]="form"
  (ngSubmit)="submit()"
  (keypress.enter)="submit()"
  class="max-w-md w-full bg-[#c7e2dd] p-8 rounded-lg shadow-md">

    <div class="mb-6">
      <label for="name" class="mb-1 block text-sm font-medium text-gray-900"> Nombre </label>
      <input
      id="name"
      type="text"
      autocomplete="name"
      formControlName="name"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="user123"
      required />
    </div>

    <div class="mb-6">
      <label for="email" class="mb-1 block text-sm font-medium text-gray-900"> Email </label>
      <input
      id="email"
      type="email"
      autocomplete="email"
      formControlName="email"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="ejemplo@gmail.com"
      required />
    </div>

    <div class="mb-6">
      <label for="password" class="mb-1 block text-sm font-medium text-gray-900"> Contraseña </label>

      <input
      id="password"
      type="password"
      formControlName="password"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="•••••••••"
      required/>
    </div>

    <div class="mb-6">
      <label for="password" class="mb-1 block text-sm font-medium text-gray-900"> Repetir contraseña </label>

      <input
      id="passwordConfirm"
      type="password"
      formControlName="passwordConfirm"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="•••••••••"
      required/>
    </div>

    <div class="flex justify-center flex-col items-center gap-4">
      <button
      type="button"
      routerLink="/log-in"
      class="text-white focus:outline-none font-medium rounded-lg text-sm w-full py-2.5 text-center">
        Registrarse
      </button>
    </div>
  </form>

</div>
