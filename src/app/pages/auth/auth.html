<header class="bg-kiago-principal px-6 py-4 shadow-md">
  <div class="flex items-center justify-center space-x-4 max-w-7xl mx-auto">
    <img src="/images/LogoSinFondo.png" alt="Kiago Logo" class="h-20 object-contain" />
    <span class="text-white font-extrabold text-3xl tracking-wider">KIAGO</span>
  </div>
</header>

<div class="h-[calc(100vh-200px)] flex items-center justify-center px-4">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="max-w-md w-full bg-[#c7e2dd] p-8 rounded-lg shadow-md"
  >
    <div class="mb-6">
      <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="ejemplo@gmail.com"
        required
      />
    </div>
    <div class="mb-6">
      <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Contraseña</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="•••••••••"
        required
      />
    </div>
    <div class="mb-6">
      <label for="confirm_password" class="block mb-2 text-sm font-medium text-gray-900"
        >Repetir contraseña</label
      >
      <input
        type="password"
        id="confirm_password"
        formControlName="passwordConfirm"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="•••••••••"
        required
      />
    </div>
    <div class="flex justify-center flex-col items-center gap-4">
      <button
        type="submit"
        class="text-white focus:outline-none font-medium rounded-lg text-sm w-full py-2.5 text-center"
      >
        Ingresar
      </button>
      <p class="text-gray-900">Aun no tienes cuenta? <a href="/register" class="text-blue-500 hover:underline">Registrate aquí</a></p>
    </div>
  </form>
</div>
