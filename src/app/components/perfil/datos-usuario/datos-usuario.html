<div class="card">
  <div class="card-body">

    <h3 class="card-title mb-4">
      Datos personales
    </h3>

    <div class="d-flex align-items-center mb-3">
      <i class="bi bi-person fs-4 me-3"></i>

      <div>
        <small class="text-muted">Nombre</small>
        <div>{{ usuario.nombre }} {{ usuario.apellido }}</div>
      </div>
    </div>

    <div class="d-flex align-items-center mb-3">
      <i class="bi bi-envelope fs-4 me-3"></i>

      <div>
        <small class="text-muted">Correo electrónico</small>
        <div>{{ usuario.email }}</div>
      </div>
    </div>

    <div class="d-flex align-items-center mb-3">
      <i class="bi bi-calendar-event fs-4 me-3"></i>

      <div>
        <small class="text-muted">Fecha de nacimiento</small>
        <div>{{ usuario.fechaNacimiento }}</div>
      </div>
    </div>

    <div class="d-flex align-items-center">
      <i class="bi bi-telephone fs-4 me-3"></i>

      <div>
        <small class="text-muted">Teléfono</small>
        <div>{{ usuario.telefono }}</div>
      </div>
    </div>

  </div>
</div>
